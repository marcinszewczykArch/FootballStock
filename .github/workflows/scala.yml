name: CI
on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
jobs:
  ci:
    # Run on external PRs, but not on internal PRs since those will be run by push to branch
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 10
    runs-on: ubuntu-20.04
    env:
      JAVA_OPTS: -Xmx4G
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Compile
        run: |
          sbt -v compile
      - name: Test
        run: |
          sbt -v test
      - name: TESTwithCODESPACE
        run: |
          echo $TEST_CODESPACE
      - name: TESTwithACTIONS
        run: |
          echo $TEST_ACTIONS